<!doctype html>
<html><head><meta charset="utf-8"><title>CATMINAL</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#09080b}body{display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:1080/1350}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script>
const W=1080,H=1350,FPS=30,DUR=30;
const cv=document.getElementById('c'),X=cv.getContext('2d');
const MONO="'DejaVu Sans Mono',monospace", SANS="'Inter','Inter Display',sans-serif";
const C={bg:'#09080b',panel:'#121016',panel2:'#17141c',line:'#2a2531',line2:'#3a3342',
 txt:'#f3e9dc',mut:'#8c8494',dim:'#5b5462',or:'#ff8a1f',hot:'#ff5b1f',amb:'#ffc04a',
 grn:'#39f39a',red:'#ff3d5e',vio:'#a98bff',cream:'#ffe7c4'};

// ---------- seeded rng ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eout=t=>1-Math.pow(1-t,3);
const fmt=(n,d=0)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---------- data ----------
const CASES=[
 {tk:'$PURR',  mc:'41K', age:'1m', why:'bundled 61%',      s:.31,pass:0,say:'bundled. nope.'},
 {tk:'$TOASTY',mc:'88K', age:'3m', why:'dev holds 34%',    s:.44,pass:0,say:'dev bag. no.'},
 {tk:'$MEOWZ', mc:'126K',age:'6m', why:'clean · organic',  s:.91,pass:1,say:'ape.',pnl:1.21},
 {tk:'$GOBLX', mc:'19K', age:'40s',why:'LP unlocked',      s:.22,pass:0,say:'lol no'},
 {tk:'$SKRT',  mc:'57K', age:'2m', why:'mint not revoked', s:.38,pass:0,say:'rug.'},
 {tk:'$BLOBBY',mc:'73K', age:'4m', why:'copycat ticker',   s:.57,pass:0,say:'seen it.'},
 {tk:'$NAPCOIN',mc:'210K',age:'9m',why:'holders spreading',s:.88,pass:1,say:'fine. ape.',pnl:1.94},
 {tk:'$FISHY', mc:'33K', age:'1m', why:'sell tax 99%',     s:.09,pass:0,say:'honeypot.'},
 {tk:'$CRUMB', mc:'64K', age:'2m', why:'snipers 48%',      s:.41,pass:0,say:'snipers. nah.'},
 {tk:'$DUCKY', mc:'95K', age:'5m', why:'socials 3m old',   s:.63,pass:0,say:'too fresh.'},
 {tk:'$ZAPP',  mc:'164K',age:'7m', why:'X velocity 4.1x',  s:.93,pass:1,say:'APE.',pnl:1.67},
 {tk:'$CHAD2', mc:'27K', age:'50s',why:'wallet cluster',   s:.27,pass:0,say:'off the table.'},
];
CASES.forEach((c,i)=>{const r=rng(100+i*7);
 c.q={rug:clamp(1-c.s+(r()-.5)*.1,.03,.97),hype:clamp(.35+r()*.6),holder:clamp(c.s+(r()-.5)*.2,.05,.97),
  dev:clamp(c.s+(r()-.5)*.25,.04,.97),bundle:clamp(c.pass?r()*.18:.3+r()*.5),lp:c.why==='LP unlocked'?0:(c.pass?1:r()>.4?1:0)};
 c.dev=c.why.startsWith('dev')?'34%':(c.pass?(1+r()*3).toFixed(1)+'%':(4+r()*14).toFixed(1)+'%');
 c.hold=Math.round(c.pass?180+r()*400:20+r()*140);
 c.xm=(c.pass?(3+r()*9):(r()*2.4)).toFixed(1);
 c.path=[Math.floor(r()*7),Math.floor(r()*7),Math.floor(r()*7)];
 c.ms=Math.round(150+r()*80);
});
const T0=1.35, D=2.15, OUT=T0+D*12; // 27.15

// ---------- layout ----------
const M=16, colW=190, gap=(W-2*M-5*colW)/4;
const MAIN_T=232, MAIN_B=928;
const colX=i=>M+i*(colW+gap);
const CARD_Y0=272, CARD_H=78, CARD_S=92;
const LEDGE=520;
const COLS=[
 {id:'01',name:'SCAN / IN',c:C.amb,cards:['new pair','dev wallet','holders','bundle check','X mentions','LP / mint','socials']},
 {id:'02',name:'ASK / QUESTIONS',c:C.or,cards:['Score · rug_risk','Score · hype','Score · holders','Choice · dev_trust','Score · bundle','Choice · copycat','Choice · action']},
 {id:'03',name:'CAT / DECIDES',c:C.vio,cards:['parallel asks','paw head','no generation','state encoder','score head','median latency','nine-lives check']},
 {id:'04',name:'GATE / 0.85',c:C.red,cards:['quarantine','watchlist','blacklist dev','review']},
 {id:'05',name:'ACT / CODE',c:C.grn,cards:['ape 0.5 SOL','tp ladder','stop -35%','blacklist sync','alpha draft','progress saved','human gate']},
];
function cardRect(ci,j){const x=colX(ci);if(ci===3)return{x,y:LEDGE+22+j*CARD_S,w:colW,h:CARD_H};return{x,y:CARD_Y0+j*CARD_S,w:colW,h:CARD_H}}
const SLOT={x:colX(3)+46,y:LEDGE-24};
const CAT={x:colX(3)+140,y:LEDGE+2,s:1.28};

// thread network
const LINKS=[];(()=>{const r=rng(7);
 for(let ci=0;ci<4;ci++){const n=COLS[ci].cards.length, n2=COLS[ci+1].cards.length;
  for(let j=0;j<n;j++){const k=3+Math.floor(r()*2);for(let q=0;q<k;q++){
    let t=Math.floor(r()*(ci===2?n2+2:n2));LINKS.push({ci,a:j,b:(ci===2&&t>=n2)?-1:t,v:r()<.3,ph:r()*10,sp:.15+r()*.35})}}}
})();
function anchorOut(ci,j){if(ci===3&&j<0)return{x:SLOT.x+40,y:SLOT.y};const r=cardRect(ci,j);return{x:r.x+r.w,y:r.y+r.h/2}}
function anchorIn(ci,j){if(ci===3&&j<0)return{x:SLOT.x-46,y:SLOT.y};const r=cardRect(ci,j);return{x:r.x,y:r.y+r.h/2}}
function bez(p,q,t){const dx=(q.x-p.x)*.55;const c1={x:p.x+dx,y:p.y},c2={x:q.x-dx,y:q.y};const u=1-t;
 return{x:u*u*u*p.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*q.x,y:u*u*u*p.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*q.y}}
function bezPath(p,q){const dx=(q.x-p.x)*.55;X.moveTo(p.x,p.y);X.bezierCurveTo(p.x+dx,p.y,q.x-dx,q.y,q.x,q.y)}
// active path polyline per case
function buildPath(c){const pts=[];const [s,a,k]=c.path;
 const seg=(p,q,b)=>{for(let i=0;i<=24;i++){pts.push(b?bez(p,q,i/24):{x:lerp(p.x,q.x,i/24),y:lerp(p.y,q.y,i/24)})}};
 seg(anchorIn(0,s),anchorOut(0,s),0);seg(anchorOut(0,s),anchorIn(1,a),1);seg(anchorIn(1,a),anchorOut(1,a),0);
 seg(anchorOut(1,a),anchorIn(2,k),1);seg(anchorIn(2,k),anchorOut(2,k),0);seg(anchorOut(2,k),{x:SLOT.x-48,y:SLOT.y},1);
 seg({x:SLOT.x-48,y:SLOT.y},{x:SLOT.x,y:SLOT.y},0);
 const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
 return{pts,L,tot:L[L.length-1]}}
CASES.forEach(c=>c.P=buildPath(c));
function along(P,f){const d=f*P.tot;let i=1;while(i<P.L.length-1&&P.L[i]<d)i++;const t=(d-P.L[i-1])/Math.max(1e-6,P.L[i]-P.L[i-1]);
 return{x:lerp(P.pts[i-1].x,P.pts[i].x,t),y:lerp(P.pts[i-1].y,P.pts[i].y,t)}}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function panel(x,y,w,h,title,right,rc){rr(x,y,w,h,8);X.fillStyle=C.panel;X.fill();X.strokeStyle=C.line;X.lineWidth=1;X.stroke();
 if(title){X.font=`700 11px ${MONO}`;X.fillStyle=C.txt;X.textAlign='left';X.fillText(title,x+12,y+20);
  if(right){X.textAlign='right';X.fillStyle=rc||C.or;X.fillText(right,x+w-12,y+20);X.textAlign='left'}}}
function txt(s,x,y,font,col,al){X.font=font;X.fillStyle=col;X.textAlign=al||'left';X.fillText(s,x,y);X.textAlign='left'}
function glowText(s,x,y,font,col,blur,al){X.save();X.shadowColor=col;X.shadowBlur=blur;txt(s,x,y,font,col,al);X.restore()}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

// ---------- state helpers ----------
function caseAt(t){if(t<T0)return{i:-1,u:0};const i=Math.min(11,Math.floor((t-T0)/D));return{i,u:t-T0-i*D}}
// phases inside a case (u seconds)
const PH={appear:.0,travel:.3,arrive:1.0,compute:1.3,verdict:1.38,swipe:.42};
function pnlAt(t){let p=0;CASES.forEach((c,i)=>{if(c.pass){const tv=T0+i*D+1.55;if(t>tv)p+=c.pnl*clamp((t-tv)/.6)}});return p}
function doneState(i,t){const tv=T0+i*D+PH.verdict;return t>tv}

// ---------- background ----------
function drawBG(t){X.fillStyle=C.bg;X.fillRect(0,0,W,H);
 // perspective grid in main area
 X.save();X.beginPath();X.rect(0,MAIN_T,W,MAIN_B-MAIN_T);X.clip();
 X.strokeStyle='rgba(255,138,31,0.045)';X.lineWidth=1;
 for(let i=0;i<=24;i++){const y=MAIN_T+((i*32+t*14)%(MAIN_B-MAIN_T));X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
 for(let i=-10;i<=34;i++){X.beginPath();X.moveTo(540+(i-12)*46,MAIN_T);X.lineTo(540+(i-12)*120,MAIN_B);X.stroke()}
 const g=X.createRadialGradient(560,560,40,560,560,560);g.addColorStop(0,'rgba(255,110,30,0.10)');g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(0,MAIN_T,W,MAIN_B-MAIN_T);
 X.restore()}

// ---------- header + KPIs ----------
function drawHeader(t){
 txt('CATMINAL',M,38,`900 26px ${SANS}`,C.or);
 X.save();X.shadowColor=C.or;X.shadowBlur=14+6*Math.sin(t*3);txt('CATMINAL',M,38,`900 26px ${SANS}`,C.or);X.restore();
 txt('/ RUG FILTER PIPELINE',M+150,36,`700 13px ${MONO}`,C.txt);
 txt('PAW SYSTEM · catminal-v0.9',M+340,36,`700 11px ${MONO}`,C.hot);
 txt('SCAN → ASK → CAT → GATE → ACT',M+545,36,`600 11px ${MONO}`,C.mut);
 txt('built by RUGIKK',W-M,36,`800 13px ${MONO}`,C.or,'right');
 X.strokeStyle=C.line;X.beginPath();X.moveTo(M,50);X.lineTo(W-M,50);X.stroke();
 const y=58,h=104,w=(W-2*M-3*10)/4;
 const prog=clamp((t-.2)/(OUT-.2));
 // 1 scanned
 let x=M;panel(x,y,w,h,'TOKENS SCANNED · THIS RUN');
 const sc=Math.round(14382*Math.pow(prog,1.15));
 glowText(fmt(sc),x+12,y+68,`800 38px ${MONO}`,C.txt,6);
 txt('pump.fun new pairs · live',x+12,y+90,`500 10px ${MONO}`,C.mut);
 for(let i=0;i<8;i++){const on=((i+Math.floor(t*12))%7)<2;X.fillStyle=on?C.amb:C.line;X.fillRect(x+w-14-i*7,y+84,4,8)}
 // 2 knocked off
 x+=w+10;panel(x,y,w,h,'KNOCKED OFF THE TABLE','LIVE',C.red);
 const kp=t<.4?0:(79.0+ (1-prog)*-9*Math.cos(t*2.2)*Math.exp(-prog*2)+(prog<1?Math.sin(t*5)*.4*(1-prog):0));
 X.save();X.shadowColor=C.hot;X.shadowBlur=18;txt(kp.toFixed(1)+'%',x+12,y+70,`900 40px ${MONO}`,C.hot);X.restore();
 X.fillStyle=C.line;X.fillRect(x+12,y+82,w-24,5);X.fillStyle=C.hot;X.fillRect(x+12,y+82,(w-24)*kp/100,5);
 txt('dead on day one · never bought',x+12,y+98,`500 10px ${MONO}`,C.mut);
 // 3 latency
 x+=w+10;panel(x,y,w,h,'MEDIAN DECISION');
 txt('~184',x+12,y+70,`800 38px ${MONO}`,C.txt);txt('ms',x+118,y+70,`600 14px ${MONO}`,C.mut);
 X.strokeStyle=C.or;X.lineWidth=1.5;X.beginPath();for(let i=0;i<60;i++){const xx=x+150+i*1.6,yy=y+56+Math.sin(i*.9+t*9)*6*Math.sin(i*.31+t*2);i?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.stroke();
 txt('paw head · no generation',x+12,y+92,`500 10px ${MONO}`,C.mut);
 // 4 pnl
 x+=w+10;panel(x,y,w,h,'SESSION PNL','SOL',C.grn);
 const p=pnlAt(t);X.save();X.shadowColor=C.grn;X.shadowBlur=14;txt('+'+p.toFixed(2),x+12,y+70,`900 40px ${MONO}`,C.grn);X.restore();
 const apes=CASES.filter((c,i)=>c.pass&&doneState(i,t)).length;
 txt(`${apes} apes · 0 rugs held`,x+12,y+92,`500 10px ${MONO}`,C.mut);
}
function drawBanner(t){const{i,u}=caseAt(t);const c=CASES[Math.max(0,i)];const y=172;
 const show=i>=0;
 rr(M,y,128,28,4);X.fillStyle=hexA(C.hot,.25);X.fill();X.strokeStyle=C.hot;X.stroke();
 txt(show?`CASE ${String(i+1).padStart(2,'0')} / 12`:'BOOTING…',M+64,y+19,`800 12px ${MONO}`,C.cream,'center');
 txt(show?c.tk:'catminal',M+142,y+23,`900 26px ${SANS}`,C.txt);
 txt(show?`pump.fun · mc ${c.mc} · age ${c.age}`:'operator: black cat · lives 9/9',M+144,y+44,`500 11px ${MONO}`,C.mut);
 // stage pills
 const st=['SCAN','ASK','CAT','GATE','ACT'];let active=-1;
 if(show){active=u<.45?0:u<.75?1:u<1.0?2:u<1.6?3:4;if(!c.pass&&active===4)active=3}
 st.forEach((s,k)=>{const w=58,x=W-M-(5-k)*(w+6);rr(x,y+2,w,26,4);
  X.fillStyle=k===active?(k===3&&show&&!c.pass&&u>PH.verdict?hexA(C.red,.35):hexA(C.or,.3)):C.panel2;X.fill();
  X.strokeStyle=k===active?C.or:C.line;X.stroke();txt(s,x+w/2,y+19,`700 11px ${MONO}`,k===active?C.cream:C.mut,'center')});
}

// ---------- pipeline ----------
function cardVals(ci,j,c){
 if(!c)return[['—','']];
 const q=c.q;
 if(ci===0)return[[ ['ticker',c.tk],['mc',c.mc]],[['dev holds',c.dev],['fresh','yes']],[['holders',String(c.hold)],['top10',c.pass?'18%':'52%']],
  [['bundled',Math.round(q.bundle*100)+'%'],['clusters',c.pass?'0':'3']],[['mentions/m',c.xm],['bots',c.pass?'low':'high']],[['LP',q.lp?'burned':'UNLOCKED'],['mint',c.why.startsWith('mint')?'ACTIVE':'revoked']],[['tg',c.pass?'2.1K':'14'],['site',c.why.startsWith('soc')?'3m old':'ok']]][j];
 if(ci===1){const v=[q.rug,q.hype,q.holder,q.dev,q.bundle,c.why.startsWith('copy')?.9:.1,c.s];const lab=['rug_risk','hype','holders','dev_trust','bundle','copycat','action'];
  return[[lab[j],v[j].toFixed(2)],['label',j===6?(c.pass?'ape':'skip'):v[j]>.5?'high':'low']]}
 if(ci===2)return[[['asks','7 / one shot'],['retries','0']],[['choice',c.pass?'ape':'swipe'],['conf',c.s.toFixed(2)]],[['tokens','0'],['cost','$0.00004']],
  [['state','packed'],['dims','2048']],[['score',c.s.toFixed(2)],['thr','0.85']],[['median',c.ms+'ms'],['p99','310ms']],[['lives','9/9'],['risk','1 life max']]][j];
 if(ci===3)return[[['held',c.pass?'0':'1'],['ttl','24h']],[['tracking','42'],['next','re-ask']],[['devs','1,284'],['synced','yes']],[['queue','3'],['human','opt']]][j];
 return[[['size','0.5 SOL'],['slip','8%']],[['tp','2x / 4x / 9x'],['moon','10%']],[['stop','-35%'],['trail','on']],[['list','synced'],['rugs','1,284']],[['post','draft only'],['auto','off']],[['saved','yes'],['run','#212']],[['gate','opt-in'],['ask','never']]][j];
}
function drawCard(ci,j,c,hl,col){const r=cardRect(ci,j);
 X.save();rr(r.x,r.y,r.w,r.h,6);X.fillStyle=hl>0?hexA(col,.10+.12*hl):'rgba(20,18,25,0.88)';X.fill();
 if(hl>0){X.shadowColor=col;X.shadowBlur=18*hl}X.strokeStyle=hl>0?hexA(col,.5+.5*hl):C.line2;X.lineWidth=hl>0?1.6:1;X.stroke();X.restore();
 X.fillStyle=col;X.fillRect(r.x+10,r.y+11,7,7);
 txt(COLS[ci].cards[j],r.x+23,r.y+19,`700 11px ${MONO}`,C.txt);
 const v=cardVals(ci,j,c);
 v.forEach((kv,k)=>{if(!kv||!kv[0])return;const yy=r.y+40+k*16;txt(kv[0],r.x+10,yy,`500 10px ${MONO}`,C.mut);
  let vc=C.cream;const s=String(kv[1]);if(/UNLOCKED|ACTIVE|swipe|high|3m old|52%/.test(s))vc=C.red;if(/burned|revoked|ape|yes|on|low/.test(s)&&ci!==1)vc=C.grn;
  txt(s,r.x+r.w-10,yy,`700 10px ${MONO}`,vc,'right')});
 // mini bar
 X.fillStyle=C.line;X.fillRect(r.x+10,r.y+r.h-9,r.w-20,2);X.fillStyle=hexA(col,.7);X.fillRect(r.x+10,r.y+r.h-9,(r.w-20)*((j*37+ci*13)%100)/100,2);
}
function drawPipeline(t){const{i,u}=caseAt(t);const c=i>=0?CASES[i]:null;
 // column headers
 COLS.forEach((cl,ci)=>{const x=colX(ci);txt(cl.id,x,MAIN_T+20,`700 11px ${MONO}`,cl.c);txt(cl.name,x+24,MAIN_T+20,`700 11px ${MONO}`,C.txt);
  X.fillStyle=cl.c;X.fillRect(x,MAIN_T+27,colW*.7,2);X.fillStyle=C.line;X.fillRect(x+colW*.7,MAIN_T+27,colW*.3,2)});
 // base threads
 X.lineWidth=1;LINKS.forEach(l=>{const p=anchorOut(l.ci,l.a),q=l.b<0?{x:SLOT.x-46,y:SLOT.y}:anchorIn(l.ci+1,l.b);
  X.strokeStyle=l.v?'rgba(169,139,255,0.13)':'rgba(255,138,31,0.12)';X.beginPath();bezPath(p,q);X.stroke()});
 // ambient particles
 LINKS.forEach((l,k)=>{const p=anchorOut(l.ci,l.a),q=l.b<0?{x:SLOT.x-46,y:SLOT.y}:anchorIn(l.ci+1,l.b);const f=(t*l.sp+l.ph)%1;const pt=bez(p,q,f);
  X.fillStyle=l.v?'rgba(190,160,255,0.75)':'rgba(255,170,80,0.75)';X.fillRect(pt.x-1,pt.y-1,2,2)});
 // highlights
 const hl=(ci,j)=>{if(!c)return 0;const [s,a,k]=c.path;
  const win=(a0,a1)=>clamp((u-a0)/.12)*clamp((a1-u)/.25+1);
  if(ci===0&&j===s)return clamp(u/.15)*(u<1.2?1:clamp((1.6-u)/.4));
  if(ci===1&&j===a)return clamp((u-.5)/.15)*(u<1.3?1:clamp((1.7-u)/.4));
  if(ci===2&&j===k)return clamp((u-.75)/.15)*(u<1.4?1:clamp((1.8-u)/.4));
  if(ci===4&&j===0&&c.pass)return clamp((u-1.5)/.15);
  if(ci===3&&j===2&&!c.pass)return clamp((u-1.5)/.2)*clamp((2.1-u)/.3);
  return 0};
 COLS.forEach((cl,ci)=>cl.cards.forEach((_,j)=>drawCard(ci,j,c,hl(ci,j),cl.c)));
 // active path bright
 if(c){const P=c.P;const f=clamp((u-PH.travel)/(PH.arrive-PH.travel));const fe=ease(f);
  const lit=clamp(u<1.8?1:(2.15-u)/.35);
  X.save();X.shadowColor=C.or;X.shadowBlur=14;X.strokeStyle=hexA(C.amb,.9*lit);X.lineWidth=2.4;X.beginPath();
  const n=Math.floor(P.pts.length*fe);for(let k=0;k<n;k++){k?X.lineTo(P.pts[k].x,P.pts[k].y):X.moveTo(P.pts[k].x,P.pts[k].y)}X.stroke();
  // glowing strands echo
  X.strokeStyle=hexA(C.hot,.35*lit);X.lineWidth=6;X.stroke();X.restore();
  // pulses along lit path
  for(let k=0;k<6;k++){const ff=((t*0.9+k/6)%1)*fe;const pt=along(P,ff);X.fillStyle=hexA(C.cream,.9*lit);X.beginPath();X.arc(pt.x,pt.y,2.2,0,7);X.fill()}
  // compute ring around CAT card
  if(u>.7&&u<1.45){const r=cardRect(2,c.path[2]);const cx=r.x+r.w/2,cy=r.y+r.h/2,a=t*7;
   X.save();X.strokeStyle=C.cream;X.lineWidth=5;X.shadowColor=C.vio;X.shadowBlur=16;X.globalAlpha=clamp((u-.7)/.1)*clamp((1.45-u)/.1);

 CASES.forEach((c,i)=>{const b=T0+i*D;L.push({s:`cat> ask ${c.tk} --all`,c:C.cream,t:b+.35,type:1});
  L.push({s:c.pass?`cat> ape ${c.tk} 0.5`:`cat> swipe ${c.tk}`,c:c.pass?C.grn:C.red,t:b+PH.verdict,type:1})});
 return L.filter(l=>l.t<=t).map(l=>{if(!l.type)return l;const n=Math.floor((t-l.t)*60);return{s:l.s.slice(0,Math.max(5,n)),c:l.c}})}

function drawFooter(t){const y=1298;X.fillStyle=C.line;X.fillRect(M,y,W-2*M,3);X.save();X.shadowColor=C.or;X.shadowBlur=10;X.fillStyle=C.or;X.fillRect(M,y,(W-2*M)*clamp(t/DUR),3);X.restore();
 txt('SCAN · ASK · CAT DECIDES · CODE ACTS',M,y+26,`700 11px ${MONO}`,C.txt);
 txt('simulated run · metrics illustrative · @rgk_degen',W-M,y+26,`500 10px ${MONO}`,C.mut,'right');
 paw(M+290,y+21,C.or);}

// ---------- outro ----------
function drawOutro(t){const v=t-OUT;if(v<0)return;const a=clamp(v/.45);
 X.save();X.globalAlpha=a*.94;X.fillStyle='#07060a';X.fillRect(0,0,W,H);X.restore();
 X.save();X.globalAlpha=a;
 const g=X.createRadialGradient(540,700,30,540,700,520);g.addColorStop(0,'rgba(255,110,30,0.22)');g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
 const sl=eout(clamp(v/.6));
 X.save();X.shadowColor=C.or;X.shadowBlur=40;txt('CATMINAL',540,310-30*(1-sl),`900 118px ${SANS}`,C.or,'center');X.restore();
 txt('the cat that runs my pump.fun terminal',540,360,`600 22px ${MONO}`,C.cream,'center');
 // table
 const ty=900;X.save();X.shadowColor=C.or;X.shadowBlur=18;X.fillStyle=C.or;X.fillRect(250,ty,580,5);X.restore();
 drawCat(600,ty+2,2.35,catState(t));
 // final chip
 const fc={tk:'$RUG',mc:'12K'};const hit=1.2+.3*.45;
 if(v<hit)chip(430,ty-46,fc,1.6,0,v>1.15?'rug':'n',v>.9?'0.04 < .85':'mc 12K');
 else{const dt=v-hit;chip(430-520*dt,ty-46-560*dt+.5*2300*dt*dt,fc,1.6,-7*dt,'rug','bye')}
 if(v>1.55)bubble(820,ty-450,'next.',clamp((v-1.55)/.15),C.amb);
 const sy=1010;
 txt('14,382 scanned   ·   79% knocked off the table   ·   +4.82 SOL',540,sy,`700 20px ${MONO}`,C.txt,'center');
 txt('SCAN → ASK → CAT → GATE 0.85 → ACT',540,sy+40,`600 15px ${MONO}`,C.mut,'center');
 X.save();X.shadowColor=C.or;X.shadowBlur=14;txt('built by RUGIKK',540,sy+100,`900 28px ${MONO}`,C.or,'center');X.restore();
 txt('simulated run · not financial advice · @rgk_degen',540,sy+136,`500 12px ${MONO}`,C.dim,'center');
 X.restore()}

// ---------- frame ----------
window.renderAt=function(t){X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.shadowBlur=0;
 drawBG(t);drawHeader(t);drawBanner(t);drawPipeline(t);drawGate(t);drawBottom(t);drawFooter(t);drawFalling(t);
 // scanline + vignette
 X.fillStyle='rgba(0,0,0,0.06)';for(let y=0;y<H;y+=3)X.fillRect(0,y,W,1);
 const vg=X.createRadialGradient(540,675,400,540,675,900);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.35)');X.fillStyle=vg;X.fillRect(0,0,W,H);
 drawOutro(t);};
window.frameData=function(t){renderAt(t);return cv.toDataURL('image/png')};
if(!navigator.webdriver){let st=performance.now();(function loop(){renderAt(((performance.now()-st)/1000)%DUR);requestAnimationFrame(loop)})()}
